<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sweden News Digest</title>
  <meta name="description" content="English-language digest of Swedish national politics, immigration &amp; citizenship law, and Gothenburg local news." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230b3d59%22/><rect x=%2213%22 width=%224%22 height=%2232%22 fill=%22%23ffcf3f%22/><rect y=%2213%22 width=%2232%22 height=%224%22 fill=%22%23ffcf3f%22/></svg>" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Sweden News Digest</h1>
          <p class="tagline">National politics, immigration law &amp; Gothenburg — in English</p>
        </div>
      </div>
      <div class="header-meta">
        <span id="updated-at" class="updated-at">Loading…</span>
        <button id="refresh-btn" class="refresh-btn" type="button" title="Reload latest data">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16.5 10a6.5 6.5 0 1 1-2-4.7"/><path d="M16.5 3.5V8h-4.5"/></svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <nav class="category-nav" aria-label="Filter by category">
    <div class="container nav-inner" id="category-nav"></div>
  </nav>

  <main class="container" id="app">
    <div id="status" class="status" role="status" aria-live="polite">Loading the latest stories…</div>
    <div id="sections"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Sources: <a href="https://www.thelocal.se/" target="_blank" rel="noopener">The Local Sweden</a>. Updated automatically several times a day.</p>
      <p class="disclaimer">Summaries are excerpts for quick scanning — read the original article for the full story.</p>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
