name: Update news data

on:
  schedule:
    # Every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and aggregate news
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name "sweden-news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- site/data/news.json; then
            echo "No changes to news data."
            exit 0
          fi
          git add site/data/news.json
          git commit -m "chore: refresh news data [skip ci]"
          git push
